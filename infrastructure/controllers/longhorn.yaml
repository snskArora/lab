---
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: longhorn
      # Longhorn 1.12.1 is the current stable release.
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  install:
    crds: Create
    remediation: { retries: 3 }
  upgrade:
    crds: CreateReplace
    remediation: { retries: 3 }
  values:
    # Snap relocates the kubelet root. Wrong path = Longhorn installs
    # clean, reports healthy, never attaches a volume.
    csi:
      kubeletRootDir: /var/snap/microk8s/common/var/lib/kubelet

    persistence:
      defaultClass: true
      defaultClassReplicaCount: 2
      # CHANGED from your values: Delete -> Retain. With Delete, removing
      # a PVC destroys the data immediately. Retain costs you a manual
      # cleanup and saves you from one bad `kubectl delete`.
      reclaimPolicy: Retain

    defaultSettings:
      defaultDataPath: /var/lib/longhorn
      defaultReplicaCount: 2
      # false = force replicas onto DIFFERENT nodes. With 2 nodes that's
      # the whole point: one copy on msi, one on dell. Soft affinity would
      # happily put both on the same node and give you no redundancy.
      replicaSoftAntiAffinity: false
      # Wi-Fi between nodes: throttle rebuild traffic so a resync doesn't
      # saturate the link and cause more timeouts than it heals.
      concurrentReplicaRebuildPerNodeLimit: 1
      replicaReplenishmentWaitInterval: 1800
      storageOverProvisioningPercentage: 200
      storageMinimalAvailablePercentage: 15
      # 2 replicas survive ONE NODE dying. They do NOT survive a cluster
      # rebuild or a bad delete. This is still required.
      # backupTarget: nfs://192.168.68.X:/volume1/longhorn-backup

    longhornUI:
      replicas: 1
