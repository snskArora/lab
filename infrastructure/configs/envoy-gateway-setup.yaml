---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-proxy-config
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        annotations:
          metallb.io/loadBalancerIPs: 10.10.10.1
        # NodePorts 30080/30443 stay as a fallback path if MetalLB misbehaves.
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080
                - port: 443
                  nodePort: 30443
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy-proxy-config
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-homelab-gateway
  namespace: envoy-gateway-system
spec:
  gatewayClassName: eg
  # Port 80 has no catch-all on purpose: Envoy prefers an exact hostname over a wildcard, so an app
  # route on a catch-all listener would serve its *.lab name over plain HTTP and skip the redirect.
  # App routes attach without sectionName and land on `http` (*.sunny) and `https` (*.lab) by hostname.
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.sunny"
      allowedRoutes:
        namespaces:
          from: All
    # Only the redirect route (this namespace) may attach here.
    - name: http-lab-redirect
      protocol: HTTP
      port: 80
      hostname: "*.lab.sanskararora.in"
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.lab.sanskararora.in"
      tls:
        mode: Terminate
        certificateRefs:
          - name: lab-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
---
# Browsers already force HTTPS here (HSTS includeSubDomains on sanskararora.in); this covers other clients.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lab-https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: envoy-homelab-gateway
      sectionName: http-lab-redirect
  hostnames:
    - "*.lab.sanskararora.in"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
