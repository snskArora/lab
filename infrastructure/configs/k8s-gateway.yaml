---
apiVersion: v1
kind: Namespace
metadata:
  name: dns
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: k8s-gateway
  namespace: flux-system
spec:
  type: oci
  interval: 1h
  url: oci://codeberg.org/k8s-gateway/charts
---
# Lives in infra-configs, not infra-controllers: its LoadBalancer Service needs the MetalLB pool
# (also in this layer) before Helm's wait can see an IP.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
  namespace: dns
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: k8s-gateway
      version: "4.0.1"
      sourceRef:
        kind: HelmRepository
        name: k8s-gateway
        namespace: flux-system
  install:
    remediation: { retries: 3 }
  values:
    image:
      tag: "1.9.2@sha256:80930fdbf98f28d4d5009cc4da8ddedbaa8afc9a6b753419e54d4cd30cea7308"
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9153"
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    service:
      annotations:
        metallb.io/loadBalancerIPs: 10.10.10.2
    # Authoritative for sunny. only, with no forward: unknown names get NXDOMAIN
    # instead of looping back to the Pi, which forwards sunny. here.
    servers:
      - zones:
          - zone: sunny.
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 10s
          - name: ready
          - name: k8s_gateway
            parameters: sunny
            configBlock: |-
              apex dns
              ttl 30
              resources Service HTTPRoute
              loadBalancerAddressPreference ip
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: cache
            parameters: "30"
          - name: reload
          - name: loadbalance
