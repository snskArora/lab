# Your longhorn-r2 class, now correct: 2 nodes, 2 replicas.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-r2
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fsType: "ext4"
