---
# Lab VIPs. Every Service must ask for its IP with the metallb.io/loadBalancerIPs annotation:
# .1 Envoy gateway, .2 k8s_gateway DNS, .3 Postgres.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lab
  namespace: metallb-system
spec:
  addresses:
    - 10.10.10.1-10.10.10.14
  autoAssign: false
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lab
  namespace: metallb-system
spec:
  ipAddressPools:
    - lab
