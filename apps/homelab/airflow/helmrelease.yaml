---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: apache-airflow
  namespace: flux-system
spec:
  interval: 1h
  url: https://airflow.apache.org
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
  namespace: airflow
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: airflow
      version: "1.22.0"
      sourceRef:
        kind: HelmRepository
        name: apache-airflow
        namespace: flux-system
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3 }
  # Admin password, merged over `values:`; created by scripts/12-airflow-secrets.sh.
  valuesFrom:
    - kind: Secret
      name: airflow-extra-values
      valuesKey: values.yaml
      optional: false
  values:
    airflowVersion: "3.2.2"
    images:
      airflow:
        repository: apache/airflow
        tag: "3.2.2"
        digest: "sha256:bef4d135ec7b64658cf64089973edd62cab8fd72203f280c7e0952213c17d912"
      statsd:
        tag: "v0.30.0@sha256:aa922156ccf915a0d033eef013d0621d5dcf10c69bd89107c2d49e8184a84268"
      gitSync:
        tag: "v4.4.2@sha256:bb0aba8bf9e49571687886594c46eb5a4084061370bff2ac6b94701f5d202674"

    # Tasks run inside the scheduler pod. Every task log line also goes to the scheduler's stdout,
    # which Fluent Bit ships to VictoriaLogs.
    executor: LocalExecutor
    nodeSelector:
      kubernetes.io/hostname: msi

    # Metadata DB: CNPG database `airflow`, tables in schema `airflow` (the role's default search_path).
    postgresql:
      enabled: false
    data:
      metadataSecretName: airflow-metadata
    fernetKeySecretName: airflow-fernet-key
    apiSecretKeySecretName: airflow-api-secret-key
    jwtSecretName: airflow-jwt-secret

    # Plain Jobs instead of Helm hooks, as the chart recommends for Flux.
    migrateDatabaseJob:
      useHelmHooks: false
      applyCustomEnv: false
    createUserJob:
      useHelmHooks: false
      applyCustomEnv: false
      defaultUser:
        role: Admin
        username: admin
        email: admin@example.com
        firstName: Admin
        lastName: User

    config:
      api:
        base_url: https://airflow.lab.sanskararora.in
      # Tasks record the scheduler pod's IP, so the UI can fetch their logs from it (a Deployment pod's
      # name is not in DNS).
      core:
        hostname_callable: airflow.utils.net.get_host_ip_address
      # One JSON object per line, so VictoriaLogs gets level, dag_id, task_id, run_id as fields.
      logging:
        json_logs: "True"

    # The Airflow UI keeps task logs for 2 hours on the pod's own disk (lost earlier if the pod restarts);
    # VictoriaLogs keeps them for 14 days.
    logs:
      emptyDirConfig:
        sizeLimit: 256Mi
      persistence:
        enabled: false
    workers:
      persistence:
        enabled: false

    dags:
      persistence:
        enabled: false
      gitSync:
        enabled: true
        repo: https://github.com/snskArora/airflow_homeserver_dags.git
        branch: main
        ref: main
        rev: HEAD
        depth: 1
        subPath: dags
        period: 60s
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { memory: 64Mi }

    apiServer:
      resources:
        requests: { cpu: 100m, memory: 384Mi }
        limits: { memory: 1Gi }
    # Sized from the first hour (2026-11-27): api-server ~320Mi, scheduler ~410Mi, dag-processor ~180Mi,
    # git-sync ~5Mi, log groomers ~1Mi, statsd ~10Mi.
    scheduler:
      resources:
        requests: { cpu: 100m, memory: 512Mi }
        limits: { memory: 1Gi }
      logGroomerSidecar:
        retentionDays: 0
        retentionMinutes: 120
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { memory: 64Mi }
    dagProcessor:
      resources:
        requests: { cpu: 50m, memory: 256Mi }
        limits: { memory: 768Mi }
      logGroomerSidecar:
        retentionDays: 0
        retentionMinutes: 120
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { memory: 64Mi }
    # Only needed for deferrable tasks; none of the DAGs use them.
    triggerer:
      enabled: false

    statsd:
      enabled: true
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 64Mi }
    redis:
      enabled: false
    pgbouncer:
      enabled: false
    flower:
      enabled: false
