---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: fluent-bit
      version: "0.58.3"
      sourceRef:
        kind: HelmRepository
        name: fluent
        namespace: flux-system
  install:
    remediation: { retries: 3 }
  values:
    kind: DaemonSet
    image:
      digest: "sha256:c5542543523c9678398dd78d927c05e8425ec15b038f226b67b3b019b1a70845"
    testFramework:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "2020"
      prometheus.io/path: /api/v2/metrics/prometheus
    # Runs as root (log files are 0640 root) but with no capabilities, so it reads only what root owns.
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]

    # /var/log covers pod logs (/var/log/pods, symlinked from /var/log/containers) and the persistent
    # journal (/var/log/journal) on both nodes. Offsets and the disk buffer survive pod restarts.
    daemonSetVolumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: etcmachineid
        hostPath:
          path: /etc/machine-id
          type: File
      - name: state
        hostPath:
          path: /var/lib/fluent-bit
          type: DirectoryOrCreate
    daemonSetVolumeMounts:
      - name: varlog
        mountPath: /var/log
        readOnly: true
      - name: etcmachineid
        mountPath: /etc/machine-id
        readOnly: true
      - name: state
        mountPath: /var/lib/fluent-bit

    args:
      - --workdir=/fluent-bit/etc
      - --config=/fluent-bit/etc/conf/fluent-bit.yaml
    config:
      service: ""
      inputs: ""
      filters: ""
      outputs: ""
      customParsers: ""
      extraFiles:
        fluent-bit.yaml: |
          service:
            flush: 1
            log_level: info
            http_server: on
            http_listen: 0.0.0.0
            http_port: 2020
            health_check: on
            scheduler.cap: 60
            storage.path: /var/lib/fluent-bit/buffer
            storage.sync: normal
            storage.max_chunks_up: 32
            storage.metrics: on

          parsers:
            - name: logfmt
              format: logfmt
            - name: json
              format: json

          pipeline:
            inputs:
              # New lines only on first start (read_from_head defaults to false).
              - name: tail
                alias: pods
                tag: kube.*
                path: /var/log/containers/*.log
                multiline.parser: cri
                db: /var/lib/fluent-bit/tail-pods.db
                db.locking: true
                refresh_interval: 10
                rotate_wait: 30
                skip_long_lines: on
                buffer_max_size: 256k
                storage.type: filesystem

              # MicroK8s services per node: both run kubelite, containerd, cluster-agent; msi also k8s-dqlite
              # and apiserver-kicker, dell also apiserver-proxy. A unit missing on a node simply matches nothing.
              - name: systemd
                alias: journald
                tag: host.*
                path: /var/log/journal
                db: /var/lib/fluent-bit/systemd.db
                read_from_tail: on
                systemd_filter_type: or
                systemd_filter:
                  - _SYSTEMD_UNIT=snap.microk8s.daemon-kubelite.service
                  - _SYSTEMD_UNIT=snap.microk8s.daemon-containerd.service
                  - _SYSTEMD_UNIT=snap.microk8s.daemon-cluster-agent.service
                  - _SYSTEMD_UNIT=snap.microk8s.daemon-k8s-dqlite.service
                  - _SYSTEMD_UNIT=snap.microk8s.daemon-apiserver-kicker.service
                  - _SYSTEMD_UNIT=snap.microk8s.daemon-apiserver-proxy.service
                  - _TRANSPORT=kernel
                storage.type: filesystem

            filters:
              # JSON app logs are merged at the top level; annotations stay out of every line.
              - name: kubernetes
                match: kube.*
                merge_log: on
                keep_log: off
                k8s-logging.parser: on
                k8s-logging.exclude: on
                labels: on
                annotations: off
                buffer_size: 256k

            outputs:
              - name: http
                alias: vl-pods
                match: kube.*
                host: victoria-logs.monitoring.svc.cluster.local
                port: 9428
                uri: /insert/jsonline?_stream_fields=kubernetes.namespace_name,kubernetes.pod_name,kubernetes.container_name,kubernetes.host&_msg_field=msg,message,log&_time_field=date&ignore_fields=_p
                format: json_lines
                json_date_key: date
                json_date_format: iso8601
                compress: zstd
                retry_limit: no_limits
                storage.total_limit_size: 1G
                log_level: warn

              - name: http
                alias: vl-journal
                match: host.*
                host: victoria-logs.monitoring.svc.cluster.local
                port: 9428
                uri: /insert/jsonline?_stream_fields=_HOSTNAME,_SYSTEMD_UNIT,_TRANSPORT&_msg_field=MESSAGE&_time_field=date
                format: json_lines
                json_date_key: date
                json_date_format: iso8601
                compress: zstd
                retry_limit: no_limits
                storage.total_limit_size: 512M
                log_level: warn
