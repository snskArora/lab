---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: prometheus-node-exporter
      version: "6.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    remediation: { retries: 3 }
  values:
    image:
      digest: "sha256:011e2d12c5bff759b90804bda642664775d7b4b127bf5148539bb82d3f590bb7"
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9100"
    resources:
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        memory: 64Mi
