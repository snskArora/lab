---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: victoria-metrics-single
      version: "0.52.0"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  install:
    remediation: { retries: 3 }
  values:
    server:
      fullnameOverride: victoria-metrics
      image:
        tag: "v1.157.0@sha256:322a7a92fdcc269280e9c38af94c83bc76827a31b792acbc60e44394e7f29c20"
      # Always give a unit: a bare number means months.
      retentionPeriod: 30d
      nodeSelector:
        kubernetes.io/hostname: msi
      persistentVolume:
        enabled: true
        size: 20Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      extraArgs:
        # Re-read the scrape config from its ConfigMap, so changes from git apply without a restart.
        promscrape.configCheckInterval: 30s
      # vmui and the API on Envoy. No auth yet: an Envoy Gateway SecurityPolicy is a later phase (backlog).
      route:
        enabled: true
        parentRefs:
          - name: envoy-homelab-gateway
            namespace: envoy-gateway-system
        hostnames:
          - metrics.lab.sanskararora.in
          - metrics.sunny
      scrape:
        enabled: true
        config:
          global:
            scrape_interval: 30s
            scrape_timeout: 10s
          scrape_configs:
            - job_name: victoriametrics
              static_configs:
                - targets: ["localhost:8428"]

            # On msi, MicroK8s' kubelite serves API server, etcd and scheduler metrics on the kubelet
            # endpoint too. The kubelet job drops those families on msi only and the apiserver job keeps
            # only them, so every series is stored once. dell's few families of these names are its own.
            - job_name: kubelet
              scheme: https
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: node
              metric_relabel_configs:
                - action: drop
                  if: '{__name__=~"(apiserver|etcd|scheduler)_.+", node="msi"}'

            - job_name: cadvisor
              scheme: https
              metrics_path: /metrics/cadvisor
              honor_timestamps: false
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: node

            - job_name: apiserver
              scheme: https
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              kubernetes_sd_configs:
                - role: endpointslice
                  namespaces:
                    names: [default]
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpointslice_port_name]
                  regex: kubernetes;https
                  action: keep
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: (apiserver|etcd|scheduler)_.+
                  action: keep
                # The four largest histograms (Kubernetes API latency); counts and errors stay.
                - source_labels: [__name__]
                  regex: apiserver_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|etcd_request_duration_seconds_bucket
                  action: drop

            # CoreDNS is managed by MicroK8s, so its pods are not annotated.
            - job_name: coredns
              kubernetes_sd_configs:
                - role: endpointslice
                  namespaces:
                    names: [kube-system]
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpointslice_port_name]
                  regex: kube-dns;metrics
                  action: keep
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node

            # MetalLB serves metrics over HTTPS only and checks the caller's token. Scoped to its namespace
            # so VictoriaMetrics' token is sent nowhere else.
            - job_name: metallb
              scheme: https
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                insecure_skip_verify: true
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [metallb-system]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  regex: metricshttps
                  action: keep
                - source_labels: [__meta_kubernetes_pod_container_name]
                  target_label: component
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node

            # kube-state-metrics reports about other objects, so its namespace/pod/node/container labels must
            # win over the target's (honor_labels). Not annotated, so the annotated-pods job skips it.
            - job_name: kube-state-metrics
              honor_labels: true
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [monitoring]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
                  regex: kube-state-metrics;http
                  action: keep

            # The lab convention: any pod with prometheus.io/scrape="true" and prometheus.io/port matching a
            # declared containerPort (optional prometheus.io/path). Plain HTTP only.
            - job_name: annotated-pods
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  regex: "true"
                  action: keep
                - action: keep_if_equal
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_container_port_number]
                - source_labels: [__meta_kubernetes_pod_phase]
                  regex: Succeeded|Failed
                  action: drop
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  regex: (.+)
                  target_label: __metrics_path__
                - source_labels: [__meta_kubernetes_pod_label_app]
                  regex: (.+)
                  target_label: job
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  regex: (.+)
                  target_label: job
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_container_name]
                  target_label: container
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
