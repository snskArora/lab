apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - grafana.yaml
# One ConfigMap per Grafana folder (keep each under ~900 KB; split a folder into a second generator if it grows).
# To add a dashboard: put the JSON in dashboards/<folder>/ and list it under that folder below.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: dashboards-homelab
    options:
      annotations:
        grafana_folder: Homelab
    files:
      - dashboards/homelab/homelab-data.json
      - dashboards/homelab/homelab-flux.json
      - dashboards/homelab/homelab-kubernetes.json
      - dashboards/homelab/homelab-network.json
  - name: dashboards-kubernetes
    options:
      annotations:
        grafana_folder: Kubernetes
    files:
      - dashboards/kubernetes/k8s-system-coredns.json
      - dashboards/kubernetes/k8s-views-global.json
      - dashboards/kubernetes/k8s-views-namespaces.json
      - dashboards/kubernetes/k8s-views-nodes.json
      - dashboards/kubernetes/k8s-views-pods.json
  - name: dashboards-nodes
    options:
      annotations:
        grafana_folder: Nodes
    files:
      - dashboards/nodes/node-exporter-full.json
  - name: dashboards-platform
    options:
      annotations:
        grafana_folder: Platform
    files:
      - dashboards/platform/envoy-clusters.json
      - dashboards/platform/envoy-gateway-global.json
      - dashboards/platform/envoy-proxy-global.json
      - dashboards/platform/flux-cluster.json
      - dashboards/platform/flux-control-plane.json
  - name: dashboards-data
    options:
      annotations:
        grafana_folder: Data
    files:
      - dashboards/data/cloudnative-pg.json
      - dashboards/data/victoriametrics.json
